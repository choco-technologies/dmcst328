; Waveshare ESP32-S3-Touch-LCD-2.8 (the revision with the CST328; the one with a CST3530 is another chip): the touch panel of the 2.8"
; display, on an I2C bus of its own, the pins from the vendor's demo:
;   SDA = GPIO1, SCL = GPIO3, RST = GPIO2 (PA2), INT = GPIO4 (not used: the driver polls).
; GPIO0..15 are port A, 16..31 port B of dmgpio (pin=PA2 is GPIO2). The chip is at 0x1A (26).
; The board's own bus (RTC, IMU: GPIO10/11) is controller 1 of dmi2c, this one is controller 2.
;
; One friends_group: dmdevfs tells every driver of the group about the others, and the friend_role says who is who. The touch panel is the
; last section (the order of the sections is the order of the creation and, reversed, of the teardown). dmgpio and dmi2c must be loaded.
; width / height: the screen the contacts are reported in - those of the display as shown (with its rotation). swap_xy / mirror_x /
; mirror_y turn the chip's axes to the screen's.

[touch_reset]
driver_name=dmgpio
driver_order=2
friends_group=touch
friend_role=reset
pin=PA2
mode=output
state=high

[touch_i2c]
driver_name=dmi2c
driver_order=2
friends_group=touch
friend_role=i2c
instance=2
role=master
address=26
baudrate=400000
timeout_ms=100
scl_pin=3
sda_pin=1

[touch]
driver_name=dmcst328
driver_order=3
friends_group=touch
width=240
height=320
reset=yes
